name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

permissions:
  contents: write  # required to create GitHub Releases

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile resources
        working-directory: src
        shell: cmd
        run: rc.exe /fo resource.res resource.rc

      - name: Build
        shell: cmd
        run: |
          cl.exe /std:c++17 /EHsc /W3 /O2 ^
            src\main.cpp ^
            src\PowermateManager.cpp ^
            src\ProfileManager.cpp ^
            src\TriggerAction.cpp ^
            src\trayIcon.cpp ^
            src\resource.res ^
            /link setupapi.lib hid.lib shell32.lib ^
            /subsystem:windows ^
            /out:PowerMateControl.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerMateControl
          path: PowerMateControl.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PowerMateControl.exe
          generate_release_notes: true
